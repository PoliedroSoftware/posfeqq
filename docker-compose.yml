version: '3.8'

services:
  # PHP Application
  app:
    image: posfeqq_app:latest
    container_name: posfeqq_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/app.ini
    depends_on:
      - mysql
      - redis
    networks:
      - posfeqq_network
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=mysql
      - DB_DATABASE=pos
      - DB_USERNAME=pos_user
      - DB_PASSWORD=pos_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: posfeqq_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/sites/:/etc/nginx/sites-available/
      - ./docker/nginx/ssl/:/etc/ssl/certs/
    depends_on:
      - app
    networks:
      - posfeqq_network

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: posfeqq_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: pos
      MYSQL_USER: pos_user
      MYSQL_PASSWORD: pos_password
      MYSQL_ROOT_PASSWORD: root_password
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/my.cnf
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    networks:
      - posfeqq_network

  # Redis Cache
  redis:
    image: redis:alpine
    container_name: posfeqq_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - posfeqq_network

  # Queue Worker (for Laravel jobs)
  queue:
    image: posfeqq_app:latest
    container_name: posfeqq_queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql
      - redis
    networks:
      - posfeqq_network
    environment:
      - APP_ENV=local
      - DB_HOST=mysql
      - DB_DATABASE=pos
      - DB_USERNAME=pos_user
      - DB_PASSWORD=pos_password
      - REDIS_HOST=redis

  # Scheduler (for Laravel cron jobs)
  scheduler:
    image: posfeqq_app:latest
    container_name: posfeqq_scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql
      - redis
    networks:
      - posfeqq_network
    environment:
      - APP_ENV=local
      - DB_HOST=mysql
      - DB_DATABASE=pos
      - DB_USERNAME=pos_user
      - DB_PASSWORD=pos_password

  # phpMyAdmin (for database management)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: posfeqq_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root_password
    depends_on:
      - mysql
    networks:
      - posfeqq_network

# Volumes
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

# Networks
networks:
  posfeqq_network:
    driver: bridge